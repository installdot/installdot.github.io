<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Elegant custom scrollbar for text areas */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

    <script>
        const galleryGrid = document.getElementById('gallery-grid');

        // =========================================================================
        // ADD YOUR LOCAL IMAGE FILENAMES AND CUSTOM TEXT HERE
        // Make sure these images are in the exact same folder as this HTML file.
        // =========================================================================
        const localData = [
            { 
                file: './IMG_8941.png', 
                text: 'Open cloudsave.' 
            },
            { 
                file: './IMG_8942.png', 
                text: 'Click account detail.' 
            },
            { 
                file: './IMG_8493.png', 
                text: 'click change mail.' 
            },
            { 
                file: './IMG_8940.png', 
                text: 'Input your new mail. Verification code will be sent to new mail inbox,not mailforspam inbox. To change password, logout and press forgot password.' 
            }
        ];

        /**
         * Core function to process local paths and build the UI cards.
         */
        function loadPredefinedImages() {
            // Loop through the array of local data objects
            localData.forEach(item => {
                
                // Get just the file name for the hover text (e.g., "image1.jpg")
                const fileName = item.file.split('/').pop();

                // Create the card container
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col group transition-all duration-300 hover:shadow-md hover:border-blue-200 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500';
                
                // HTML structure for the card containing the image, the custom text, and the textarea
                card.innerHTML = `
                    <div class="relative w-full h-56 bg-slate-100 border-b border-slate-100 overflow-hidden flex items-center justify-center text-slate-400">
                        <!-- We use onerror to show a placeholder if the local file isn't found -->
                        <img 
                            src="${item.file}" 
                            alt="${fileName}" 
                            onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='block';"
                            class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                            loading="lazy"
                        >
                        <!-- Error fallback text if image is missing -->
                        <div class="hidden text-sm text-center px-4">
                            Image not found:<br><span class="font-mono text-xs text-red-500">${fileName}</span>
                        </div>
                        
                        <!-- Small badge to show filename on hover -->
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10">
                            <p class="text-white text-xs truncate font-medium drop-shadow-md" title="${fileName}">${fileName}</p>
                        </div>
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow bg-white border-b border-slate-100">
                        <!-- This is your custom text injected from the array above -->
                        <p class="text-sm text-slate-800 leading-relaxed">${item.text}</p>
                    </div>

                    <div class="p-3 flex flex-col bg-slate-50">
                        <textarea 
                            class="w-full min-h-[70px] p-2 text-sm text-slate-700 bg-white border border-slate-200 focus:border-blue-400 focus:ring-0 rounded-lg resize-y placeholder-slate-400 transition-colors"
                            placeholder="Type additional notes here if needed..."
                        ></textarea>
                    </div>
                `;
                
                // Append the new card to the grid
                galleryGrid.appendChild(card);
            });
        }

        // Run the function as soon as the page loads
        window.addEventListener('DOMContentLoaded', loadPredefinedImages);
    </script>
</body>
</html>
